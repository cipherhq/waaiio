          if ! echo "$OUTPUT" | grep -q "passed"; then echo "❌ No Migration 312 DB tests passed."; exit 1; fi
          echo "✅ Migration 312 ticket-row identity concurrency tests complete — zero skips, zero failures."

      - name: Migration 313 atomic reschedule DB tests
        env:
          PGHOST: localhost
