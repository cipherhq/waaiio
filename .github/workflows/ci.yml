      - name: FIN-002 two-session contention test
        if: hashFiles('scripts/test-fin-002-db.sql') != ''
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: waaiio_test
        run: |
          echo "=== FIN-002: Two-session contention test ==="

          # Trap-based cleanup — runs even on test failure
          cleanup() {
            echo "Cleaning up contention test data..."
            psql -c "DROP TABLE IF EXISTS _contention_winner_token" 2>/dev/null || true
            psql -c "DELETE FROM business_payouts WHERE id='99999999-9999-9999-9999-999999999999'" 2>/dev/null || true
            psql -c "DELETE FROM payout_accounts WHERE id='99cccccc-cccc-cccc-cccc-cccccccccccc'" 2>/dev/null || true
            psql -c "DELETE FROM businesses WHERE id='99bbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb'" 2>/dev/null || true
            psql -c "DELETE FROM profiles WHERE id='99aaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa'" 2>/dev/null || true
            psql -c "ALTER TABLE auth.users DISABLE TRIGGER ALL; DELETE FROM auth.users WHERE id='99aaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa'; ALTER TABLE auth.users ENABLE TRIGGER ALL;" 2>/dev/null || true
            rm -f /tmp/session_a_result.txt /tmp/session_b_result.txt
          }
          trap cleanup EXIT

          # Create fresh test data for the contention test
          psql -v ON_ERROR_STOP=1 <<'SETUP'
          ALTER TABLE auth.users DISABLE TRIGGER ALL;
          INSERT INTO auth.users (id, email) VALUES ('99aaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'contention@test.local') ON CONFLICT DO NOTHING;
          ALTER TABLE auth.users ENABLE TRIGGER ALL;
          INSERT INTO profiles (id, first_name, last_name, email) VALUES ('99aaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'CT', 'Test', 'ct@test.local') ON CONFLICT DO NOTHING;
          INSERT INTO businesses (id, name, slug, owner_id, address, city, neighborhood, phone, status, payout_mode, country_code, verification_level)
          VALUES ('99bbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', 'Contention Test', 'contention-test', '99aaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', '1 Test', 'Lagos', 'VI', '+0000', 'active', 'platform_managed', 'NG', 'basic') ON CONFLICT DO NOTHING;
          INSERT INTO payout_accounts (id, business_id, gateway, bank_name, account_name, bank_code, account_number, is_active, verified_at)
          VALUES ('99cccccc-cccc-cccc-cccc-cccccccccccc', '99bbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', 'paystack', 'Test', 'Test', '058', '0123456789', true, NOW()) ON CONFLICT DO NOTHING;
          INSERT INTO business_payouts (id, business_id, payout_account_id, period_start, period_end, gross_amount, platform_fee, gateway_fee, net_amount, status)
          VALUES ('99999999-9999-9999-9999-999999999999', '99bbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', '99cccccc-cccc-cccc-cccc-cccccccccccc', '2024-06-01', '2024-06-07', 8000, 400, 80, 7520, 'pending') ON CONFLICT DO NOTHING;
          SETUP

          # Create a persistent table to hold Session A's returned token for
          # cross-session comparison (temp tables are session-scoped).
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS _contention_winner_token (claimed_token UUID);"

          # Session A: claim inside a transaction, hold lock with pg_sleep.
          # Store the returned token into the persistent comparison table (not printed).
          psql -v ON_ERROR_STOP=1 -t -A <<'SESSION_A' > /tmp/session_a_result.txt 2>&1 &
          BEGIN;
          INSERT INTO _contention_winner_token
            SELECT claimed_token FROM claim_payout_for_transfer('99999999-9999-9999-9999-999999999999', 'paystack_transfer', NULL);
          SELECT COUNT(*) FROM _contention_winner_token;
          -- Hold the transaction open for 2 seconds so Session B overlaps
          SELECT pg_sleep(2);
          COMMIT;
          SESSION_A
          PID_A=$!

          # Wait briefly to ensure Session A has started and locked the row
          sleep 0.5

          # Session B: attempt to claim the same payout while A holds the lock
          psql -v ON_ERROR_STOP=1 -t -A <<'SESSION_B' > /tmp/session_b_result.txt 2>&1 &
          SELECT COUNT(*) FROM claim_payout_for_transfer('99999999-9999-9999-9999-999999999999', 'paystack_transfer', NULL);
          SESSION_B
          PID_B=$!

          # Wait for both sessions
          wait $PID_A
          EXIT_A=$?
          wait $PID_B
          EXIT_B=$?

          echo "Session A exit code: $EXIT_A"
          echo "Session B exit code: $EXIT_B"

          # Parse results — only claim counts, no sensitive token values
          SESSION_A_COUNT=$(grep -E '^[0-9]+$' /tmp/session_a_result.txt | head -1 | tr -d '[:space:]')
          SESSION_B_COUNT=$(grep -E '^[0-9]+$' /tmp/session_b_result.txt | head -1 | tr -d '[:space:]')
          echo "Session A claim count: $SESSION_A_COUNT"
          echo "Session B claim count: $SESSION_B_COUNT"

          # Verify the payout state — compare values without printing tokens
          FINAL_STATUS=$(psql -t -A -c "SELECT status FROM business_payouts WHERE id='99999999-9999-9999-9999-999999999999'")
          TOKEN_NOT_NULL=$(psql -t -A -c "SELECT claim_token IS NOT NULL FROM business_payouts WHERE id='99999999-9999-9999-9999-999999999999'")
          KEY_MATCHES=$(psql -t -A -c "SELECT provider_idempotency_key = 'payout_99999999-9999-9999-9999-999999999999' FROM business_payouts WHERE id='99999999-9999-9999-9999-999999999999'")

          # Verify winner's returned token matches the persisted claim_token
          # (without printing either value). Session A stored its returned token
          # in _contention_winner_token; compare it to the payout's claim_token.
          WINNER_TOKEN_MATCHES=$(psql -t -A <<'VERIFY'
          SELECT (SELECT claimed_token FROM _contention_winner_token) IS NOT NULL
            AND (SELECT claimed_token FROM _contention_winner_token)
              = (SELECT claim_token FROM business_payouts WHERE id='99999999-9999-9999-9999-999999999999');
          VERIFY
          )

          echo "Final status: $FINAL_STATUS"
          echo "Token not null: $TOKEN_NOT_NULL"
          echo "Key matches expected: $KEY_MATCHES"

          # Assertions
          FAILED=0
          if [ "$EXIT_A" -ne 0 ]; then echo "FAIL: Session A errored"; FAILED=1; fi
          if [ "$EXIT_B" -ne 0 ]; then echo "FAIL: Session B errored"; FAILED=1; fi
          if [ "$SESSION_A_COUNT" != "1" ]; then echo "FAIL: Session A (winner) should claim 1, got $SESSION_A_COUNT"; FAILED=1; fi
          if [ "$SESSION_B_COUNT" != "0" ]; then echo "FAIL: Session B (loser) should claim 0, got $SESSION_B_COUNT"; FAILED=1; fi
          TOTAL_CLAIMS=$((SESSION_A_COUNT + SESSION_B_COUNT))
          if [ "$TOTAL_CLAIMS" != "1" ]; then echo "FAIL: exactly one total winner expected, got $TOTAL_CLAIMS"; FAILED=1; fi
          if [ "$FINAL_STATUS" != "processing" ]; then echo "FAIL: status should be processing, got $FINAL_STATUS"; FAILED=1; fi
          if [ "$TOKEN_NOT_NULL" != "t" ]; then echo "FAIL: claim_token should not be null"; FAILED=1; fi
          if [ "$KEY_MATCHES" != "t" ]; then echo "FAIL: provider_idempotency_key mismatch"; FAILED=1; fi
          if [ "$WINNER_TOKEN_MATCHES" != "t" ]; then echo "FAIL: winner token not persisted correctly"; FAILED=1; fi

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Two-session contention test FAILED"
            exit 1
          fi

          echo "✅ Two-session contention test PASSED"
          echo "  - Session A won the claim (1 row returned)"
          echo "  - Session B returned 0 rows (loser)"
          echo "  - Exactly 1 total winner across both sessions"
          echo "  - Sessions overlapped (B blocked while A held row lock)"
          echo "  - Final status = processing"
          echo "  - Token persisted, key = payout_{id}"

