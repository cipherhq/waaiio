          DO $$ BEGIN CREATE PUBLICATION supabase_realtime; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (id TEXT PRIMARY KEY, name TEXT NOT NULL, public BOOLEAN DEFAULT false, created_at TIMESTAMPTZ DEFAULT NOW(), updated_at TIMESTAMPTZ DEFAULT NOW());
          CREATE TABLE IF NOT EXISTS storage.objects (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), bucket_id TEXT REFERENCES storage.buckets(id), name TEXT, owner UUID, created_at TIMESTAMPTZ DEFAULT NOW(), updated_at TIMESTAMPTZ DEFAULT NOW());
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          CREATE OR REPLACE FUNCTION storage.foldername(name TEXT) RETURNS TEXT[] AS $$ SELECT string_to_array(name, '/'); $$ LANGUAGE SQL IMMUTABLE;
          STUBS

          for f in supabase/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -q -v ON_ERROR_STOP=1 -f "$f" || { echo "❌ FAILED: $(basename $f)"; exit 1; }
          done
          echo "✅ All migrations applied to waaiio_stripe_fin_test"

          # Set flag so the test skips its own migration application
          export MIGRATIONS_PRE_APPLIED=1

          echo "Running #177 Stripe recurring finalization DB tests (waaiio_stripe_fin_test)..."
          set +e
          OUTPUT=$(npx vitest run lib/__tests__/stripe-recurring-finalization-db.test.ts 2>&1)
          TEST_EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "❌ Stripe recurring finalization DB tests failed with exit code $TEST_EXIT."
            exit "$TEST_EXIT"
          fi
          if echo "$OUTPUT" | grep -qP '(\d+) skipped'; then
            SKIP_COUNT=$(echo "$OUTPUT" | grep -oP '(\d+) skipped' | head -1 | grep -oP '\d+')
            if [ "$SKIP_COUNT" != "0" ] && [ -n "$SKIP_COUNT" ]; then
              echo "❌ Stripe recurring finalization DB tests had $SKIP_COUNT skipped. All must execute."
              exit 1
            fi
          fi
          if ! echo "$OUTPUT" | grep -q "passed"; then
            echo "❌ No Stripe recurring finalization DB tests passed."
            exit 1
          fi
          echo "✅ #177 Stripe recurring finalization DB tests complete — zero skips, zero failures."

  # ── Engineering Governance ──
  governance:
    name: Engineering governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Validate governance artifacts
        run: node scripts/verify-engineering-governance.mjs

      - name: Validate migration repair plan
        run: npm run verify:migration-repair-plan

  # ── Playwright Smoke Tests ──
  playwright:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: main-app

    env:
      # Dummy Supabase URL matching CSP connect-src pattern (*.supabase.co).
      # Uses a non-routable subdomain so DNS fails fast on most resolvers.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_dummy
      NEXT_PUBLIC_POSTHOG_KEY: dummy
      NEXT_PUBLIC_META_APP_ID: dummy
      NEXT_PUBLIC_SENTRY_DSN: https://dummy@sentry.io/0
      SENTRY_DSN: https://dummy@sentry.io/0
      SENTRY_ORG: dummy
      SENTRY_PROJECT: dummy
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx next build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start server and run tests
        run: |
          npx next start &
          SERVER_PID=$!
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 2
          done
          # Run only chromium (faster CI, mobile is supplementary)
          npx playwright test e2e/smoke.spec.ts --project=chromium --reporter=list
          TEST_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $TEST_EXIT

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Secret Scanning ──
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secrets in code
        run: |
          echo "Scanning for potential secrets..."
          FOUND=0
          PATTERNS=(
            'sk_live_'
            'pk_live_'
            'FLWSECK_'
            'sq0atp-'
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVC'
            'sbp_'
            'xoxb-'
            'ghp_'
          )
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(git grep -l "$pattern" -- ':!.env.example' ':!node_modules' ':!.next' ':!*.lock' ':!.github/workflows/ci.yml' ':!.husky/pre-commit' ':!.agents/skills/*/references/*' 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Found potential secret pattern '$pattern' in:"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Potential secrets found. Please review."
            exit 1
          fi
          echo "✅ No secrets detected."

  # ── Dependency Audit ──
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Check for wildcard dependencies
        run: |
          echo "Checking for wildcard (*) dependencies..."
          if grep -E ':\s*"\*"' package.json admin/package.json 2>/dev/null; then
            echo "❌ Wildcard dependencies found. Pin to specific versions."
            exit 1
          fi
          echo "✅ No wildcard dependencies."
