name: Nigeria AS60068 DNS Deep Diagnostic

on:
  push:
    branches:
      - diag/nigeria-dns-as60068

permissions:
  contents: read

jobs:
  diagnostic:
    name: Exact Nigeria probe DNS diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
    steps:
      - name: Install pinned Globalping CLI v1.6.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/jsdelivr/globalping-cli/releases/download/v1.6.0/globalping_1.6.0_linux_amd64.deb'
          file='/tmp/globalping_1.6.0_linux_amd64.deb'
          expected='048a5a87dfdccc6a6cec4b5ca48a94f917215660d7e5e2e784e1105afb664db6'
          curl --fail --location --silent --show-error "$url" --output "$file"
          echo "$expected  $file" | sha256sum --check --strict
          sudo dpkg -i "$file"
          globalping version

      - name: Run DNS diagnostics on exact probes from the 5-probe run
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/nigeria-dns-as60068
          out='artifacts/nigeria-dns-as60068'
          # dns_waaiio_com_a_isp measurement from run 37296788873.
          # Globalping accepts a previous measurement ID as the location selector,
          # which reuses those exact five probes (including Datacamp Lagos AS60068).
          probe_set='2a9SepExOVZX9w8zt00021GCK'

          run_dns() {
            local label="$1"
            local host="$2"
            shift 2
            local rc=0
            globalping dns "$host" from "$probe_set" \
              --timeout 20 --ci --json "$@" \
              >"$out/${label}.json" 2>"$out/${label}.stderr.txt" || rc=$?
            echo "$rc" >"$out/${label}.exitcode"
          }

          for host in waaiio.com www.waaiio.com staging.waaiio.com; do
            safe="${host//./_}"
            run_dns "${safe}_a_udp" "$host" --type A --protocol udp
            run_dns "${safe}_a_tcp" "$host" --type A --protocol tcp
          done

          run_dns waaiio_com_ds_udp waaiio.com --type DS --protocol udp
          run_dns waaiio_com_dnskey_udp waaiio.com --type DNSKEY --protocol udp
          run_dns waaiio_com_trace_udp waaiio.com --type A --protocol udp --trace

          {
            echo '# Nigeria / Datacamp AS60068 DNS deep diagnostic'
            echo
            echo 'Read-only Globalping measurements using the exact five probes from run 37296788873.'
            echo
            for file in "$out"/*.json; do
              [[ -s "$file" ]] || continue
              label="$(basename "$file" .json)"
              echo "## $label"
              jq -r '
                .results[]?
                | select(.probe.asn == 60068)
                | "Probe: \(.probe.city), \(.probe.country) | \(.probe.network) AS\(.probe.asn) | tags=\(.probe.tags|join(",")) | configured_resolvers=\(.probe.resolvers|join(","))\nstatus=\(.result.status) failureSource=\(.result.failureSource // "") resolver=\(.result.resolver // "") statusCode=\(.result.statusCodeName // "")\n--- RAW ---\n\(.result.rawOutput // "")\n"' "$file"
              echo
            done
          } > "$out/summary.md"

          cat "$out/summary.md"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nigeria-dns-as60068-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nigeria-dns-as60068/
          if-no-files-found: warn
          retention-days: 7
