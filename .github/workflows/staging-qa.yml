name: Staging QA

# ── Trigger: manual only ──
# This workflow is workflow_dispatch ONLY. It does NOT run on push or PR.
# It does NOT affect existing CI jobs or the merge gate.
# Scheduled runs are deferred until deterministic tests are stable (Phase C).

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging URL to test against (must be a staging deployment)'
        required: true
        default: 'https://staging.waaiio.com'
        type: string
      deployment_sha:
        description: 'Exact 40-char SHA of the deployed staging build (required for evidence integrity)'
        required: true
        type: string
      run_auth_tests:
        description: 'Run authenticated merchant tests (requires staging credentials)'
        required: true
        default: true
        type: boolean

# Never run more than one staging QA at a time
concurrency:
  group: staging-qa
  cancel-in-progress: false

jobs:
  staging-qa:
    name: Staging QA — browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ── EXPLICIT environment variable allowlist ──
    # ONLY these variables are injected. No production API keys,
    # payment secrets, email credentials, or messaging tokens.
    # Workflow inputs are passed ONLY through these env vars — never
    # interpolated directly in shell `run:` blocks (injection prevention).
    env:
      E2E_STAGING_URL: ${{ inputs.staging_url }}
      E2E_DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
      E2E_SUPABASE_REF: tqjvrzopvtczxfxiwmnz
      PLAYWRIGHT_BASE_URL: ${{ inputs.staging_url }}
      # Credentials from repository secrets — never hardcoded
      E2E_STAGING_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
      E2E_STAGING_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
      # Playwright: disable traces, videos, and HAR capture in CI
      # to prevent credential leakage through artifacts.
      PW_TEST_SCREENSHOT: 'off'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Safety guards ──
      # All guards use env vars ($E2E_STAGING_URL, $E2E_DEPLOYMENT_SHA)
      # instead of ${{ inputs.* }} to prevent command injection.

      - name: Guard — reject production targets and enforce HTTPS
        run: |
          # Parse hostname using positional argument (not string interpolation)
          HOSTNAME=$(python3 -c "import sys; from urllib.parse import urlparse; print(urlparse(sys.argv[1]).hostname or '')" "$E2E_STAGING_URL")
          PROTOCOL=$(python3 -c "import sys; from urllib.parse import urlparse; print(urlparse(sys.argv[1]).scheme)" "$E2E_STAGING_URL")

          if [ -z "$HOSTNAME" ]; then
            echo "::error::FAIL-CLOSED: Cannot parse hostname from E2E_STAGING_URL."
            exit 1
          fi

          # Enforce HTTPS for non-loopback targets
          if [ "$HOSTNAME" != "localhost" ] && [ "$HOSTNAME" != "127.0.0.1" ]; then
            if [ "$PROTOCOL" != "https" ]; then
              echo "::error::FAIL-CLOSED: Non-loopback target must use HTTPS. Got '$PROTOCOL'."
              exit 1
            fi
          fi

          # Block exact production hostnames
          for PROD_HOST in waaiio.com www.waaiio.com app.waaiio.com; do
            if [ "$HOSTNAME" = "$PROD_HOST" ]; then
              echo "::error::FAIL-CLOSED: Hostname '$HOSTNAME' is a production target. Only staging URLs allowed."
              exit 1
            fi
          done

          # Block production Supabase ref anywhere in URL
          if echo "$E2E_STAGING_URL" | grep -qF 'cxcmiqotkowhxinjbytg'; then
            echo "::error::FAIL-CLOSED: URL contains production Supabase ref."
            exit 1
          fi

          # Verify hostname is in staging allowlist
          case "$HOSTNAME" in
            staging.waaiio.com|localhost|127.0.0.1)
              echo "Guard passed: exact staging hostname '$HOSTNAME'"
              ;;
            *waaiiostaging*|*waaiio-staging*)
              if echo "$HOSTNAME" | grep -qE '\.vercel\.app$'; then
                echo "Guard passed: Vercel staging preview '$HOSTNAME'"
              else
                echo "::error::FAIL-CLOSED: Hostname '$HOSTNAME' contains staging marker but is not a .vercel.app preview."
                exit 1
              fi
              ;;
            *)
              echo "::error::FAIL-CLOSED: Hostname '$HOSTNAME' is not in the staging allowlist."
              exit 1
              ;;
          esac

      - name: Guard — no dangerous secrets in environment
        run: |
          FAILED=0
          # Check ALL categories: service keys, payment, messaging, email, AI, internal tokens
          for VAR in \
            SUPABASE_SERVICE_ROLE_KEY \
            META_CLOUD_ACCESS_TOKEN META_APP_SECRET META_CLOUD_PHONE_NUMBER_ID META_WEBHOOK_VERIFY_TOKEN \
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PAYOUT_WEBHOOK_SECRET \
            PAYSTACK_SECRET_KEY \
            FLUTTERWAVE_SECRET_KEY FLUTTERWAVE_WEBHOOK_HASH FLW_SECRET_HASH \
            SQUARE_ACCESS_TOKEN SQUARE_APPLICATION_SECRET SQUARE_OAUTH_APP_SECRET SQUARE_WEBHOOK_SIGNATURE_KEY \
            PAYPAL_CLIENT_SECRET \
            ANTHROPIC_API_KEY OPENAI_API_KEY \
            RESEND_API_KEY \
            INTERNAL_API_TOKEN CRON_SECRET TOKEN_ENCRYPTION_KEY FLOW_TOKEN_SECRET PHONE_OTP_HMAC_SECRET \
            TURNSTILE_SECRET_KEY \
            UPSTASH_REDIS_REST_TOKEN \
          ; do
            if [ -n "${!VAR}" ]; then
              echo "::error::FAIL-CLOSED: $VAR is unexpectedly present in staging QA environment"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "Guard passed: no dangerous secrets present (checked 25 variables)"

      - name: Guard — verify staging credentials available (if auth tests requested)
        if: inputs.run_auth_tests
        run: |
          if [ -z "$E2E_STAGING_EMAIL" ] || [ -z "$E2E_STAGING_PASSWORD" ]; then
            echo "::error::BLOCKED — E2E_STAGING_EMAIL and E2E_STAGING_PASSWORD must be set as repository secrets for authenticated tests."
            exit 1
          fi
          echo "Staging credentials available (values not printed)"

      - name: Guard — verify deployment identity
        run: |
          # Parse hostname to check if target is remote
          HOSTNAME=$(python3 -c "import sys; from urllib.parse import urlparse; print(urlparse(sys.argv[1]).hostname or '')" "$E2E_STAGING_URL")

          if [ "$HOSTNAME" = "localhost" ] || [ "$HOSTNAME" = "127.0.0.1" ]; then
            echo "Skipping identity verification for localhost target"
            exit 0
          fi

          IDENTITY_URL="${E2E_STAGING_URL%/}/api/release-identity"
          echo "Checking deployment identity at: $IDENTITY_URL"

          RESPONSE=$(curl -sf --max-time 15 -H "Accept: application/json" "$IDENTITY_URL" 2>&1) || {
            echo "::error::FAIL-CLOSED: Cannot reach $IDENTITY_URL — deployment identity unverifiable."
            exit 1
          }

          PROJECT_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('projectId',''))")
          VERCEL_ENV=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('vercelEnv',''))")
          DEPLOY_SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          SUPABASE_REF=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('supabaseProjectRef',''))")

          EXPECTED_PROJECT="prj_h7YmC4fvpxhn429znCy34OjLZ6se"
          if [ "$PROJECT_ID" != "$EXPECTED_PROJECT" ]; then
            echo "::error::FAIL-CLOSED: projectId '$PROJECT_ID' does not match expected '$EXPECTED_PROJECT'."
            exit 1
          fi

          if [ "$VERCEL_ENV" = "production" ]; then
            echo "::error::FAIL-CLOSED: vercelEnv is 'production'. Staging QA must not target production."
            exit 1
          fi

          # Verify Supabase database identity (B1)
          EXPECTED_SUPABASE_REF="tqjvrzopvtczxfxiwmnz"
          if [ "$SUPABASE_REF" != "$EXPECTED_SUPABASE_REF" ]; then
            echo "::error::FAIL-CLOSED: supabaseProjectRef '$SUPABASE_REF' does not match expected staging ref '$EXPECTED_SUPABASE_REF'."
            exit 1
          fi

          if [ -z "$E2E_DEPLOYMENT_SHA" ]; then
            echo "::error::FAIL-CLOSED: deployment_sha is required for remote targets."
            exit 1
          fi

          if [ "$DEPLOY_SHA" != "$E2E_DEPLOYMENT_SHA" ]; then
            echo "::error::FAIL-CLOSED: Deployed SHA '$DEPLOY_SHA' does not match expected '$E2E_DEPLOYMENT_SHA'."
            exit 1
          fi

          echo "Deployment identity verified:"
          echo "  projectId: $PROJECT_ID"
          echo "  vercelEnv: $VERCEL_ENV"
          echo "  sha: $DEPLOY_SHA"
          echo "  supabaseProjectRef: $SUPABASE_REF"

      # ── Test execution ──

      - name: Record evidence metadata
        run: |
          echo "## Staging QA Evidence" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Staging URL | \`$E2E_STAGING_URL\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source SHA | \`$GITHUB_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment SHA | \`${E2E_DEPLOYMENT_SHA:-not provided}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase Ref | \`tqjvrzopvtczxfxiwmnz\` (staging) |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Auth tests | \`${{ inputs.run_auth_tests }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | \`$GITHUB_ACTOR\` |" >> $GITHUB_STEP_SUMMARY

      - name: Run auth boundary tests (no credentials needed)
        run: |
          npx playwright test e2e/staging/auth-boundaries.spec.ts \
            --project=chromium \
            --reporter=list,json \
            --config=e2e/playwright.staging.config.ts
        env:
          E2E_SOURCE_SHA: ${{ github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: auth-boundaries-results.json

      - name: Run authenticated staging tests
        if: inputs.run_auth_tests
        run: |
          npx playwright test \
            e2e/staging/dashboard-smoke.spec.ts \
            e2e/staging/navigation.spec.ts \
            e2e/staging/settings.spec.ts \
            e2e/staging/catalog.spec.ts \
            e2e/staging/customers.spec.ts \
            e2e/staging/contracts-waivers.spec.ts \
            e2e/staging/whatsapp-channels.spec.ts \
            e2e/staging/engage.spec.ts \
            e2e/staging/financials.spec.ts \
            --project=chromium \
            --reporter=list,json \
            --config=e2e/playwright.staging.config.ts
        env:
          E2E_SOURCE_SHA: ${{ github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: authenticated-results.json

      # ── Artifacts: STRICTLY ALLOWLISTED EVIDENCE ONLY ──
      # Never upload raw Playwright JSON, HTML, traces, HAR, videos,
      # screenshots, or storageState. Generate a per-test status report
      # with only allowlisted fields (title, status, duration).

      - name: Generate allowlisted test evidence
        if: always()
        run: |
          # Delete ALL potentially sensitive artifacts FIRST
          rm -rf test-results/ playwright-report/ 2>/dev/null || true
          find . -name '*.storageState.json' -delete 2>/dev/null || true
          find . -name 'storageState*.json' -delete 2>/dev/null || true
          find . -name '*.har' -delete 2>/dev/null || true
          find . -name '*.webm' -delete 2>/dev/null || true
          find . -name '*.png' -path '*/test-results/*' -delete 2>/dev/null || true

          # Parse evidence using the tested script (same code tested in CI unit tests).
          # Fails closed on: parse errors, unknown/interrupted/timedOut statuses,
          # missing reports, or empty results.
          python3 scripts/parse-evidence.py --output-dir staging-qa-summary

          # Delete raw JSON results (may contain error messages, URLs, credentials)
          rm -f *-results.json

      - name: Upload allowlisted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qa-evidence-${{ github.run_number }}
          path: staging-qa-summary/
          retention-days: 14

      # ── Summary ──

      - name: Append test results to summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f staging-qa-summary/evidence.json ]; then
            VALID=$(python3 -c "import json; d=json.load(open('staging-qa-summary/evidence.json')); print(d.get('evidence_valid',False))")
            PASSED=$(python3 -c "import json; d=json.load(open('staging-qa-summary/evidence.json')); print(d.get('passed',0))")
            FAILED=$(python3 -c "import json; d=json.load(open('staging-qa-summary/evidence.json')); print(d.get('failed',0))")
            SKIPPED=$(python3 -c "import json; d=json.load(open('staging-qa-summary/evidence.json')); print(d.get('skipped',0))")
            TOTAL=$(python3 -c "import json; d=json.load(open('staging-qa-summary/evidence.json')); print(d.get('total',0))")
            TIMED_OUT=$(python3 -c "import json; d=json.load(open('staging-qa-summary/evidence.json')); print(d.get('timed_out',0))")
            INTERRUPTED=$(python3 -c "import json; d=json.load(open('staging-qa-summary/evidence.json')); print(d.get('interrupted',0))")
            AUTH_RAN=$(python3 -c "import json; d=json.load(open('staging-qa-summary/evidence.json')); print(d.get('auth_tests_executed',False))")

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| Timed out | $TIMED_OUT |" >> $GITHUB_STEP_SUMMARY
            echo "| Interrupted | $INTERRUPTED |" >> $GITHUB_STEP_SUMMARY
            echo "| Auth tests executed | $AUTH_RAN |" >> $GITHUB_STEP_SUMMARY
            echo "| Evidence valid | $VALID |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$VALID" != "True" ]; then
              echo "**EVIDENCE INVALID.** Parse errors, unknown statuses, timeouts, or interrupted tests detected. This is NOT a valid QA pass." >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -gt 0 ]; then
              echo "**Some tests failed.** See evidence.json artifact for per-test results." >> $GITHUB_STEP_SUMMARY
            elif [ "$AUTH_RAN" = "False" ]; then
              echo "**Auth boundary tests passed. Authenticated tests were NOT executed.**" >> $GITHUB_STEP_SUMMARY
              echo "This is NOT a complete staging QA pass." >> $GITHUB_STEP_SUMMARY
            else
              echo "All executed tests passed (auth boundary + authenticated suites)." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "**No evidence file generated.** Evidence step failed or did not run." >> $GITHUB_STEP_SUMMARY
          fi
