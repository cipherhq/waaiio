name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact Git SHA to deploy (40 hex chars)'
        required: true
        type: string
      phase:
        description: 'prepare deploys both apps; finalize verifies separately applied postdeploy migration'
        required: true
        default: prepare
        type: choice
        options: [prepare, finalize]
  push:
    branches:
      - 'prod-deploy/**'
    paths:
      - '.release/production-sha.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROD_ORG_ID: team_AEcg69CktrGEptXDznpae8Rp
  PROD_PROJECT_ID: prj_QkvBTiDA905GHTwX5DQCJVyZzd9d
  PROD_URL: https://www.waaiio.com
  ADMIN_PROJECT_ID: prj_jr7l0grIW2xE6FxVTy5RwRec1rFt
  RELEASE_PHASE: ${{ inputs.phase || 'prepare' }}
  OWNER_ACTOR: cipherhq
  VERCEL_CLI_VERSION: "60.1.3"

jobs:
  deploy-production:
    name: "Deploy exact SHA to production"
    runs-on: ubuntu-latest

    steps:
      - name: Verify Owner authorization
        shell: bash
        run: |
          if [ "${{ github.actor }}" != "${{ env.OWNER_ACTOR }}" ] \
            || [ "${{ github.triggering_actor }}" != "${{ env.OWNER_ACTOR }}" ]; then
            echo "❌ ABORT: Production runs and reruns must be initiated by the Owner (${{ env.OWNER_ACTOR }})."
            echo "   Initiated by: ${{ github.triggering_actor }}"
            exit 1
          fi

          case "${{ github.event_name }}" in
            workflow_dispatch|push) ;;
            *)
              echo "❌ ABORT: Unsupported trigger: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          echo "✅ Owner authorization verified: ${{ github.actor }}"

      - name: Checkout trigger ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact target SHA
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.sha }}"
          else
            if [ ! -f .release/production-sha.txt ]; then
              echo "❌ ABORT: .release/production-sha.txt is required for push-triggered production deploys."
              exit 1
            fi
            SHA=$(tr -d '[:space:]' < .release/production-sha.txt)
          fi

          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "❌ ABORT: Target SHA must be exactly 40 lowercase hex characters. Got: $SHA"
            exit 1
          fi

          echo "TARGET_SHA=$SHA" >> "$GITHUB_ENV"
          echo "✅ Target SHA resolved: ${SHA:0:8}"

      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checkout integrity
        shell: bash
        run: |
          CHECKOUT_SHA=$(git rev-parse HEAD)
          if [ "$CHECKOUT_SHA" != "${{ env.TARGET_SHA }}" ]; then
            echo "❌ ABORT: checkout HEAD $CHECKOUT_SHA does not match requested SHA ${{ env.TARGET_SHA }}"
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ ABORT: working tree is not clean."
            git status --short
            exit 1
          fi

          echo "✅ Exact clean checkout proven: ${CHECKOUT_SHA:0:8}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm

      - name: Install dependencies and pinned Vercel CLI
        run: |
          npm ci
          npm install -g "vercel@${{ env.VERCEL_CLI_VERSION }}"

      - name: Verify original release delta and phase against live evidence
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_RELEASE_MANIFEST: ${{ secrets.PRIVATE_RELEASE_MANIFEST }}
          PRIVATE_RELEASE_RECEIPT: ${{ secrets.PRIVATE_RELEASE_RECEIPT }}
          PRIVATE_RELEASE_ACCEPTANCE_REPORT: ${{ secrets.PRIVATE_RELEASE_ACCEPTANCE_REPORT }}
          PRIVATE_RELEASE_ACCEPTANCE_SHA256: ${{ secrets.PRIVATE_RELEASE_ACCEPTANCE_SHA256 }}
        run: node scripts/release-phase-gate.mjs "$RELEASE_PHASE" "$TARGET_SHA"

      - name: Deploy exact SHA to production project
        if: env.RELEASE_PHASE == 'prepare'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.PROD_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.PROD_PROJECT_ID }}
        shell: bash
        run: |
          echo "DEPLOY_MUTATED=true" >> "$GITHUB_ENV"
          echo "Deploying exact SHA ${{ env.TARGET_SHA }} to Waaiio production..."

          set +e
          DEPLOY_OUTPUT=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1)
          DEPLOY_EXIT=$?
          set -e

          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "❌ Vercel deploy failed with exit code $DEPLOY_EXIT"
            echo "$DEPLOY_OUTPUT"
            exit 1
          fi

          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^ ]+\.vercel\.app' | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "❌ Could not capture immutable deployment URL."
            exit 1
          fi

          DEP_INSPECT=$(curl -sS -f \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$(echo "$DEPLOY_URL" | sed 's|https://||')?teamId=${{ env.PROD_ORG_ID }}") || {
            echo "❌ Could not inspect created deployment."
            exit 1
          }

          NEW_INFO=$(echo "$DEP_INSPECT" | node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              if (!d.id || !d.id.startsWith('dpl_')) process.exit(1);
              if (d.projectId !== '${{ env.PROD_PROJECT_ID }}') process.exit(1);
              const sha = d.meta && d.meta.githubCommitSha;
              if (sha !== '${{ env.TARGET_SHA }}') process.exit(1);
              console.log([d.id, d.url || ''].join('|'));
            } catch { process.exit(1); }
          ") || {
            echo "❌ Created deployment does not match production project + exact Git SHA."
            exit 1
          }

          NEW_ID=$(echo "$NEW_INFO" | cut -d'|' -f1)
          echo "NEW_DEPLOYMENT_ID=$NEW_ID" >> "$GITHUB_ENV"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "✅ Production deployment created: $NEW_ID ($DEPLOY_URL)"

      - name: Promote exact deployment
        if: env.RELEASE_PHASE == 'prepare'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set +e
          OUTPUT=$(vercel promote "${{ env.DEPLOY_URL }}" --yes --timeout 5m \
            --token "$VERCEL_TOKEN" --scope "${{ env.PROD_ORG_ID }}" 2>&1)
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Exact deployment promoted."
          elif echo "$OUTPUT" | grep -q "${{ env.NEW_DEPLOYMENT_ID }}" \
            && echo "$OUTPUT" | grep -q "already the current production deployment"; then
            echo "✅ Exact deployment is already active (idempotent promotion)."
          else
            echo "❌ Promotion failed."
            echo "$OUTPUT"
            exit 1
          fi

      - name: Prove control-plane identity and public health
        if: env.RELEASE_PHASE == 'prepare'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          EXPECTED_SHA="${{ env.TARGET_SHA }}"
          EXPECTED_DEPLOYMENT="${{ env.NEW_DEPLOYMENT_ID }}"
          MAX_ATTEMPTS=30

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            PROJECT_STATE=$(curl -sS -f \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/${{ env.PROD_PROJECT_ID }}?teamId=${{ env.PROD_ORG_ID }}" \
              2>/dev/null || echo '')

            ACTIVE_ID=$(echo "$PROJECT_STATE" | node -e "
              try {
                const p = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                const t = p.targets && p.targets.production;
                console.log(t && t.id ? t.id : '');
              } catch { console.log(''); }
            " 2>/dev/null || echo '')

            DEPLOY_STATE=$(curl -sS -f \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$EXPECTED_DEPLOYMENT?teamId=${{ env.PROD_ORG_ID }}" \
              2>/dev/null || echo '')

            DEPLOY_IDENTITY=$(echo "$DEPLOY_STATE" | node -e "
              try {
                const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                const sha = d.meta && d.meta.githubCommitSha;
                console.log([d.projectId || '', d.readyState || '', sha || ''].join('|'));
              } catch { console.log('||'); }
            " 2>/dev/null || echo '||')

            DEPLOY_PROJECT=$(echo "$DEPLOY_IDENTITY" | cut -d'|' -f1)
            DEPLOY_READY=$(echo "$DEPLOY_IDENTITY" | cut -d'|' -f2)
            DEPLOY_SHA=$(echo "$DEPLOY_IDENTITY" | cut -d'|' -f3)

            IMMUTABLE_STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" \
              "${{ env.DEPLOY_URL }}/" 2>/dev/null || echo '000')
            PROD_STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" \
              "${{ env.PROD_URL }}/" 2>/dev/null || echo '000')
            FAVICON_STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" \
              "${{ env.PROD_URL }}/apple-touch-icon.png" 2>/dev/null || echo '000')

            if [ "$ACTIVE_ID" = "$EXPECTED_DEPLOYMENT" ] \
              && [ "$DEPLOY_PROJECT" = "${{ env.PROD_PROJECT_ID }}" ] \
              && [ "$DEPLOY_READY" = "READY" ] \
              && [ "$DEPLOY_SHA" = "$EXPECTED_SHA" ] \
              && [ "$IMMUTABLE_STATUS" = "200" ] \
              && [ "$PROD_STATUS" = "200" ] \
              && [ "$FAVICON_STATUS" = "200" ]; then
              echo "✅ Exact production deployment + public health proven on attempt $ATTEMPT."
              exit 0
            fi

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: active=${ACTIVE_ID:-none}; deployment=${DEPLOY_READY:-none}/${DEPLOY_SHA:-none}; immutable=$IMMUTABLE_STATUS; production=$PROD_STATUS; favicon=$FAVICON_STATUS"
            sleep 10
          done

          echo "❌ Production control plane/public health did not converge to the exact release."
          exit 1

      - name: Verify canonical favicon is advertised
        if: env.RELEASE_PHASE == 'prepare'
        shell: bash
        run: |
          HTML=$(curl -sS -L --fail "${{ env.PROD_URL }}/")
          if ! echo "$HTML" | grep -q 'apple-touch-icon.png'; then
            echo "❌ Production HTML does not advertise the canonical purple Waaiio icon."
            exit 1
          fi
          echo "✅ Canonical favicon reference present in production HTML."

      - name: Deploy exact SHA to admin production project
        if: env.RELEASE_PHASE == 'prepare'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.PROD_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.ADMIN_PROJECT_ID }}
        shell: bash
        run: |
          echo "DEPLOY_MUTATED=true" >> "$GITHUB_ENV"
          # The Vercel project's configured rootDirectory selects admin/ from
          # this same exact repository checkout. Do not deploy an unrelated cwd.
          OUTPUT=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1) || {
            echo "Admin deployment failed; retain partial state for Owner review."
            exit 1
          }
          URL=$(echo "$OUTPUT" | grep -oE 'https://[^ ]+\.vercel\.app' | tail -1)
          test -n "$URL"
          INSPECT=$(curl -sS -f -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID")
          ADMIN_ID=$(echo "$INSPECT" | node -e '
            const d=JSON.parse(require("fs").readFileSync(0,"utf8"));
            if(!/^dpl_[a-zA-Z0-9]+$/.test(d.id || "") || d.projectId!==process.env.VERCEL_PROJECT_ID ||
              d.readyState!=="READY" || d.meta?.githubCommitSha!==process.env.TARGET_SHA) process.exit(1);
            console.log(d.id);
          ')
          echo "NEW_ADMIN_DEPLOYMENT_ID=$ADMIN_ID" >> "$GITHUB_ENV"
          set +e
          PROMOTE=$(vercel promote "$URL" --yes --timeout 5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" 2>&1)
          PROMOTE_EXIT=$?
          set -e
          if [ "$PROMOTE_EXIT" -ne 0 ]; then
            if ! echo "$PROMOTE" | grep -Fwq "$ADMIN_ID" || \
              ! echo "$PROMOTE" | grep -Fq "already the current production deployment"; then
              echo "Admin promotion failed; retain partial state for Owner review."
              exit 1
            fi
          fi

      - name: Verify both apps before postdeployment migration
        if: env.RELEASE_PHASE == 'prepare'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_RELEASE_MANIFEST: ${{ secrets.PRIVATE_RELEASE_MANIFEST }}
          PRIVATE_RELEASE_RECEIPT: ${{ secrets.PRIVATE_RELEASE_RECEIPT }}
          PRIVATE_RELEASE_ACCEPTANCE_REPORT: ${{ secrets.PRIVATE_RELEASE_ACCEPTANCE_REPORT }}
          PRIVATE_RELEASE_ACCEPTANCE_SHA256: ${{ secrets.PRIVATE_RELEASE_ACCEPTANCE_SHA256 }}
        run: node scripts/release-phase-gate.mjs ready-for-post "$TARGET_SHA"

      - name: Preserve state on failure
        if: failure() && env.DEPLOY_MUTATED == 'true'
        run: |
          echo "Release incomplete. No automatic rollback is permitted."
          echo "Inspect both live app identities and migration state before Owner-authorized recovery."
          echo "A rollback to the old uploader may be incompatible with postdeployment storage policies."

      - name: Production phase summary
        if: success()
        run: |
          if [ "$RELEASE_PHASE" = "finalize" ]; then
            echo "Final gate passed: both exact app identities and all original migration SQL verified."
          else
            echo "Both apps verified. RELEASE INCOMPLETE pending M492 application and final gate."
            echo "Apply approved M492 separately via MCP after acceptance checks; then dispatch finalize for this same SHA."
          fi
          echo "Target SHA: $TARGET_SHA"
