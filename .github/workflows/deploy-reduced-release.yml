name: Deploy verified reduced release
on:
  workflow_dispatch:
    inputs:
      verify_run_id:
        description: 'Successful exact-target verification run ID'
        type: string
        required: true
      verify_run_attempt:
        description: 'Successful verification run attempt'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  plan:
    name: Verify trusted reduced release plan
    runs-on: ubuntu-24.04
    outputs:
      payout_policy: ${{ steps.plan.outputs.payout_policy }}
      full_release_policy: ${{ steps.plan.outputs.full_release_policy }}
      merchant_target: ${{ steps.plan.outputs.merchant_target }}
      admin_target: ${{ steps.plan.outputs.admin_target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: trusted
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
      - name: Verify protected integration and bounded source deltas
        id: plan
        env:
          CONTROL_PATH: trusted
          GITHUB_TOKEN: ${{ github.token }}
          REDUCED_RELEASE_MANIFEST: ${{ secrets.REDUCED_RELEASE_MANIFEST }}
        run: node trusted/scripts/reduced-release-gate.mjs plan
  deploy:
    name: Deploy separately verified project targets
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted deployment gate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: trusted
      - name: Checkout exact merchant source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.merchant_target }}
          fetch-depth: 0
          persist-credentials: false
          path: merchant-source
      - name: Checkout exact admin source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.admin_target }}
          fetch-depth: 0
          persist-credentials: false
          path: admin-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
      - name: Install pinned deployment CLI
        run: npm install --global vercel@60.1.3
      - name: Verify both evidence chains and deploy exact clean targets
        env:
          CONTROL_PATH: trusted
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REDUCED_RELEASE_MANIFEST: ${{ secrets.REDUCED_RELEASE_MANIFEST }}
          PRIVATE_RELEASE_RECEIPT: ${{ needs.plan.outputs.payout_policy == 'true' && secrets.PRIVATE_RELEASE_RECEIPT || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_REPORT: ${{ needs.plan.outputs.payout_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_REPORT || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_SHA256: ${{ needs.plan.outputs.payout_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_SHA256 || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_CHUNK_1: ${{ needs.plan.outputs.full_release_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_CHUNK_1 || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_CHUNK_2: ${{ needs.plan.outputs.full_release_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_CHUNK_2 || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_CHUNK_3: ${{ needs.plan.outputs.full_release_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_CHUNK_3 || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_CHUNK_4: ${{ needs.plan.outputs.full_release_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_CHUNK_4 || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_CHUNK_5: ${{ needs.plan.outputs.full_release_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_CHUNK_5 || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_CHUNK_6: ${{ needs.plan.outputs.full_release_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_CHUNK_6 || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_CHUNK_7: ${{ needs.plan.outputs.full_release_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_CHUNK_7 || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_CHUNK_8: ${{ needs.plan.outputs.full_release_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_CHUNK_8 || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_CHUNK_9: ${{ needs.plan.outputs.full_release_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_CHUNK_9 || '' }}
          PRIVATE_RELEASE_ACCEPTANCE_CHUNK_10: ${{ needs.plan.outputs.full_release_policy == 'true' && secrets.PRIVATE_RELEASE_ACCEPTANCE_CHUNK_10 || '' }}
          VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
          VERIFY_RUN_ATTEMPT: ${{ inputs.verify_run_attempt }}
        run: node trusted/scripts/reduced-release-gate.mjs deploy merchant-source admin-source
      - name: Stop for Owner recovery review on failure
        if: failure()
        run: echo 'Reduced release incomplete. Preserve current state for private Owner review; no automatic rollback.'
